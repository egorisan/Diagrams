services:
  db:
    image: postgres:16-alpine
    container_name: diagrams_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-diagrams_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-diagrams_pass}
      POSTGRES_DB: ${POSTGRES_DB:-diagrams_db}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    container_name: diagrams_backend
    env_file:
      - ./backend/.env
    environment:
      # БД из сервиса db выше. Чтобы использовать внешнюю БД — удалите эту строку
      # и укажите DATABASE_URL в backend/.env
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-diagrams_user}:${POSTGRES_PASSWORD:-diagrams_pass}@db:5432/${POSTGRES_DB:-diagrams_db}
    depends_on:
      db:
        condition: service_healthy
    # API доступен только через nginx (frontend).
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: diagrams_frontend
    ports:
      - "${APP_PORT:-80}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  db_data:
